<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacked By Codename 777</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    position: relative;
  }

  /* Scanline halus */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(255, 255, 255, 0.03) 0px,
      rgba(255, 255, 255, 0.03) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 2;
  }

  /* Glow di belakang GIF */
  .glow {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, transparent 70%);
    filter: blur(40px);
    z-index: 0;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.15); opacity: 1; }
  }

  img {
    position: relative;
    z-index: 1;
    max-width: 70%;
    max-height: 55vh;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow:
      0 0 20px rgba(0, 255, 255, 0.3),
      0 0 60px rgba(0, 255, 255, 0.1);
    margin-bottom: 40px;
  }

  h1 {
    position: relative;
    z-index: 1;
    color: #ffffff;
    font-size: clamp(1.5rem, 4.5vw, 3rem);
    letter-spacing: 5px;
    font-weight: bold;
    text-align: center;
    padding: 0 20px;
    text-shadow:
      0 0 8px rgba(255, 255, 255, 0.8),
      0 0 20px rgba(0, 255, 255, 0.5);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <img src="https://media.tenor.com/EEujH1Sdr5IAAAAm/hanako.webp" alt="">
  <h1>Hacked By Codename 777</h1>
</body>
</html>
